name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ["22", "26"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm contracts:gate-test
      - run: pnpm fixtures:check
      - name: Check frozen contract compatibility
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm contracts:compat
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium
        if: matrix.node == '22'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop browser tests
        if: matrix.node == '22' && github.event_name == 'pull_request'
        run: pnpm exec playwright test --project=desktop
      - name: Run full browser tests
        if: matrix.node == '22' && github.event_name == 'push'
        run: pnpm test:e2e
      - uses: astral-sh/setup-uv@v6
        if: matrix.node == '22'
      - name: Install live-test backend
        if: matrix.node == '22'
        run: uv sync --project .. --frozen
      - name: Run desktop live browser tests
        if: matrix.node == '22' && github.event_name == 'pull_request'
        run: pnpm exec playwright test --config playwright.live.config.ts --project=desktop
      - name: Run full live browser tests
        if: matrix.node == '22' && github.event_name == 'push'
        run: pnpm test:e2e:live
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.node == '22'
        with:
          name: frontend-test-results-node-${{ matrix.node }}
          path: frontend/test-results/
