name: Frontend

on:
  workflow_call:
  push:
    paths:
      - "frontend/**"
      - "contracts/**"
      - "src/wayfarer/adventures/**"
      - "tests/reference_provider.py"
      - "scripts/check_browser_evidence.py"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "contracts/**"
      - "src/wayfarer/adventures/**"
      - "tests/reference_provider.py"
      - "scripts/check_browser_evidence.py"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ["22", "26"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm contracts:gate-test
      - run: pnpm fixtures:check
      - name: Check frozen contract compatibility
        if: github.event_name == 'pull_request'
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm contracts:compat
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium
        if: matrix.node == '22'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop browser tests
        if: matrix.node == '22' && github.event_name == 'pull_request'
        run: pnpm exec playwright test --project=desktop --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/browser.xml
      - name: Run full browser tests
        if: matrix.node == '22' && github.event_name != 'pull_request'
        run: pnpm test:e2e --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/browser.xml
      - uses: astral-sh/setup-uv@v7
        if: matrix.node == '22'
      - name: Install live-test backend
        if: matrix.node == '22'
        run: uv sync --project .. --frozen
      - name: Run desktop live browser tests
        if: matrix.node == '22' && github.event_name == 'pull_request'
        run: pnpm exec playwright test --config playwright.live.config.ts --project=desktop --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/live.xml
      - name: Run full live browser tests
        if: matrix.node == '22' && github.event_name != 'pull_request'
        run: pnpm test:e2e:live --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/live.xml
      - name: Run reference adventure browser tests
        if: matrix.node == '22'
        run: pnpm exec playwright test --config playwright.reference.config.ts --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/reference.xml
      - name: Run production new-game browser tests
        if: matrix.node == '22'
        run: pnpm test:e2e:startup --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/startup.xml
      - name: Verify production PWA shell
        if: matrix.node == '22'
        run: pnpm exec playwright test --config playwright.pwa.config.ts --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: reports/pwa.xml
      - name: Require complete browser evidence
        if: always() && matrix.node == '22'
        run: python3 ../scripts/check_browser_evidence.py reports
      - uses: actions/upload-artifact@v7
        if: always() && matrix.node == '22'
        with:
          name: frontend-test-results-node-${{ matrix.node }}
          path: |
            frontend/test-results/
            frontend/reports/
