name: Python package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen python scripts/check_quality_gates.py
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv build
      - name: Install wheel into a separate environment
        run: |
          uv venv /tmp/wayfarer-wheel --python '${{ matrix.python }}'
          uv pip install --python /tmp/wayfarer-wheel/bin/python --no-deps dist/*.whl
      - name: Exercise wheel outside checkout
        run: uv run --frozen python scripts/smoke_installed.py /tmp/wayfarer-wheel/bin/wayfarer
