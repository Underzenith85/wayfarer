name: Python package

on:
  workflow_call:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "contracts/**"
      - "server.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "docs/product-release.json"
      - ".github/workflows/package.yml"

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wayfarer
          POSTGRES_PASSWORD: wayfarer
          POSTGRES_DB: wayfarer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wayfarer -d wayfarer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAYFARER_TEST_DATABASE_URL: postgresql://wayfarer:wayfarer@127.0.0.1:5432/wayfarer_test
    strategy:
      matrix:
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.33'
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen python scripts/check_no_any.py
      - run: uv run --frozen python scripts/check_quality_gates.py
      - run: uv run --frozen python scripts/audit_gurps_sources.py > /tmp/gurps-source-audit.json
      - run: uv run --frozen python scripts/audit_gurps_equipment.py > /tmp/gurps-equipment-audit.json
      - run: uv run --frozen python scripts/validate_contracts.py
      - run: uv run --frozen python -m scripts.validate_live_contracts
      - run: uv run --frozen pytest --junitxml=artifacts/pytest.xml --cov-report=xml:artifacts/coverage.xml --cov-report=term-missing
      - name: Verify and publish mechanics evidence
        if: always()
        run: uv run --frozen python -m scripts.release_gates artifacts/pytest.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-release-evidence
          path: artifacts/
          if-no-files-found: error
      - run: uv build
      - name: Install wheel into a separate environment
        run: |
          uv venv /tmp/wayfarer-wheel --python '${{ matrix.python }}'
          uv pip install --python /tmp/wayfarer-wheel/bin/python dist/*.whl
      - name: Exercise wheel outside checkout
        run: uv run --frozen python scripts/smoke_installed.py /tmp/wayfarer-wheel/bin/wayfarer
