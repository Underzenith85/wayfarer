name: PR gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: pr-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select:
    name: Select affected tests
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.selection.outputs.python_changed }}
      frontend_changed: ${{ steps.selection.outputs.frontend_changed }}
      python_mode: ${{ steps.selection.outputs.python_mode }}
      python_tests: ${{ steps.selection.outputs.python_tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select tests from the pull-request diff
        id: selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/select_pr_tests.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  python:
    name: Affected Python tests
    needs: select
    if: >-
      needs.select.outputs.python_changed == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wayfarer
          POSTGRES_PASSWORD: wayfarer
          POSTGRES_DB: wayfarer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wayfarer -d wayfarer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAYFARER_TEST_DATABASE_URL: postgresql://wayfarer:wayfarer@127.0.0.1:5432/wayfarer_test
      PYTHON_MODE: ${{ needs.select.outputs.python_mode }}
      PYTHON_TESTS: ${{ needs.select.outputs.python_tests }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.33'
          python-version: '3.14'
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy
      - run: uv run --frozen python scripts/check_no_any.py
      - run: uv run --frozen python scripts/check_quality_gates.py
      - run: uv run --frozen python scripts/audit_gurps_sources.py > /tmp/gurps-source-audit.json
      - run: uv run --frozen python scripts/audit_gurps_equipment.py > /tmp/gurps-equipment-audit.json
      - run: uv run --frozen python scripts/validate_contracts.py
      - run: uv run --frozen python -m scripts.validate_live_contracts
      - name: Run affected tests and the invariant spine
        if: env.PYTHON_MODE == 'focused'
        run: uv run --frozen pytest --no-cov $PYTHON_TESTS
      - name: Run the complete suite when selection is unsafe
        if: env.PYTHON_MODE == 'full'
        run: uv run --frozen pytest --no-cov

  frontend:
    name: Affected frontend tests
    needs: select
    if: >-
      needs.select.outputs.frontend_changed == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm contracts:gate-test
      - run: pnpm fixtures:check
      - name: Check frozen contract compatibility
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm contracts:compat
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Run tests affected by the pull-request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm exec vitest run --changed="$BASE_SHA"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the desktop browser smoke suite
        run: pnpm exec playwright test --project=desktop

  affected:
    name: PR affected validation
    if: always()
    needs: [select, python, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable affected check
        env:
          SELECT: ${{ needs.select.result }}
          PYTHON: ${{ needs.python.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          test "$SELECT" = success
          test "$PYTHON" = success -o "$PYTHON" = skipped
          test "$FRONTEND" = success -o "$FRONTEND" = skipped

  full-python:
    name: Complete Python certification
    if: contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/package.yml

  full-frontend:
    name: Complete frontend certification
    if: contains(github.event.pull_request.labels.*.name, 'full-ci')
    uses: ./.github/workflows/frontend.yml

  merge:
    name: Full merge validation
    if: always()
    needs: [affected, full-python, full-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require the full-ci label and complete suites
        env:
          HAS_FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          AFFECTED: ${{ needs.affected.result }}
          PYTHON: ${{ needs.full-python.result }}
          FRONTEND: ${{ needs.full-frontend.result }}
        run: |
          if test "$HAS_FULL_CI" != true; then
            echo "::error::Add the full-ci label to run complete validation before merge."
            exit 1
          fi
          test "$AFFECTED" = success
          test "$PYTHON" = success
          test "$FRONTEND" = success
