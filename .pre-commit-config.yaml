repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy strict
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: no-explicit-any
        name: no explicit Any
        entry: uv run --frozen python scripts/check_no_any.py
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        always_run: true
