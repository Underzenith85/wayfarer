[build-system]
requires = ["uv_build==0.11.33"]
build-backend = "uv_build"

[project]
name = "wayfarer"
version = "0.2.0"
description = "Persistent roleplaying engine and local GURPS-inspired demo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22.1",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.2",
    "structlog>=26.1.0",
    "openai-codex>=0.147.0",
]

[project.scripts]
wayfarer = "wayfarer.cli:main"
wayfarer-codex-login = "wayfarer.codex_login:main"

[dependency-groups]
# Existing tests use unittest; pytest/Hypothesis arrive in roadmap issue #4.
dev = [
    "hypothesis>=6.167.1",
    "jsonschema==4.26.0",
    "mypy>=2.3.1",
    "openapi-spec-validator==0.9.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "types-jsonschema==4.26.0.20260518",
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "scripts", "server.py"]
strict = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["ignore-without-code"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers --cov=wayfarer --cov-report=term-missing --cov-fail-under=65"
markers = ["integration: exercises storage or HTTP boundaries", "e2e: exercises an installed application"]


[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]

[tool.coverage.run]
branch = true
omit = ["src/wayfarer/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

