services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wayfarer
      POSTGRES_PASSWORD: wayfarer-test-only
      POSTGRES_DB: wayfarer_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfarer -d wayfarer_test"]
      interval: 1s
      timeout: 3s
      retries: 30
